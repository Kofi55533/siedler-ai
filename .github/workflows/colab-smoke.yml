name: Colab Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-colab.txt

      - name: Install Colab dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-colab.txt

      - name: Syntax check
        run: |
          python -m py_compile COLAB_COPY_PASTE.py colab_training.py environment.py production_system.py worker_simulation.py smoke_check.py

      - name: Import smoke test
        run: python smoke_check.py --check-deps
